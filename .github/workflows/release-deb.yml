name: Build .deb package (dual-suite)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bookworm
            container: debian:bookworm
          - target: resolute
            container: ubuntu:26.04
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}

    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils zstd

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential xutils-dev \
            libx11-dev libxext-dev libxaw7-dev libxt-dev libxmu-dev \
            libice-dev libsm-dev x11proto-dev \
            zlib1g-dev libjpeg-dev libwrap0-dev


      - name: Build viewer and utilities
        run: |
          cd vnc_unixsrc
          xmkmf -a
          make CDEBUGFLAGS="-O2" World


      - name: Build Xvnc server
        run: |
          cd vnc_unixsrc/Xvnc
          ./configure
          make AR="ar cq" EXTRA_LIBRARIES="-lwrap" CDEBUGFLAGS="-O2 -fcommon" \
               EXTRA_DEFINES="-DUSE_LIBWRAP=1"


      - name: Determine version
        id: version
        run: |
          base=$(grep '^Version:' vnc_unixsrc/tightvnc.spec | awk '{print $2}')
          rev=${{ github.run_number }}
          echo "version=${base}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"


      - name: Package with checkinstall
        run: |
          apt-get install -y checkinstall
          cd vnc_unixsrc
          mkdir -p /usr/share/man/man1
          checkinstall --default \
            --pkgname=tightvnc \
            --pkgversion="${{ steps.version.outputs.version }}" \
            --maintainer="graham@netlinux.co.uk" \
            --pakdir=. \
            --install=no \
            --fstrans=no \
            ./vncinstall /usr/bin /usr/share/man


      - name: Repack .deb for reprepro compatibility
        run: |
          cd vnc_unixsrc
          DEB=$(ls tightvnc_*.deb)
          chmod 666 "$DEB"
          mkdir repack && cd repack
          ar x "../$DEB"
          for f in *.zst; do
            [ -f "$f" ] || continue
            zstd -d "$f"
            xz "${f%.zst}"
            rm "$f"
          done
          rm "../$DEB"
          ar rcs "../$DEB" debian-binary control.tar.xz data.tar.xz


      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: |
            **/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute tag
        id: tag
        run: echo "tag=v${{ github.run_number }}-dualsuite" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ github.run_number }} (bookworm + resolute)
          body: |
            Dual-suite build from commit ${{ github.sha }}.
            Both ~bookworm1 and ~resolute1 .debs are attached.
          files: artifacts/**/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify package repository
        run: |
          sleep 5
          PAYLOAD='{"repo":"netlinux-ai/tightvnc","tag":"${{ steps.tag.outputs.tag }}"}'
          SIGNATURE=$(echo -n "$PAYLOAD" \
            | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" -binary \
            | xxd -p -c 256)
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" \
            https://packages.netlinux.co.uk/webhook/update-repo
