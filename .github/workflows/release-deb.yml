# Build manifest — replayed by the netlinux dev pipeline.
# Not auto-triggered in GHA; use `gh workflow run release-deb.yml` to
# run manually on a GitHub-hosted runner.
name: Build .deb package (dual-suite)
true:
  push:
    branches:
    - main
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: bookworm
          container: debian:bookworm
        - target: resolute
          container: ubuntu:26.04
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}
    steps:
    - name: Bootstrap container
      run: "apt-get update\napt-get install -y --no-install-recommends \\\n  ca-certificates curl git xz-utils zstd \\\n \
        \ build-essential dpkg-dev sudo\n"
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: "apt-get update\napt-get install -y \\\n  build-essential xutils-dev \\\n  libx11-dev libxext-dev libxaw7-dev libxt-dev\
        \ libxmu-dev \\\n  libice-dev libsm-dev x11proto-dev \\\n  zlib1g-dev libjpeg-dev libwrap0-dev\n"
    - name: Build viewer and utilities
      run: 'cd vnc_unixsrc

        xmkmf -a

        make CDEBUGFLAGS="-O2" World

        '
    - name: Build Xvnc server
      run: "cd vnc_unixsrc/Xvnc\n./configure\nmake AR=\"ar cq\" EXTRA_LIBRARIES=\"-lwrap\" CDEBUGFLAGS=\"-O2 -fcommon\" \\\
        \n     EXTRA_DEFINES=\"-DUSE_LIBWRAP=1\"\n"
    - name: Determine version
      id: version
      run: 'base=$(grep ''^Version:'' vnc_unixsrc/tightvnc.spec | awk ''{print $2}'')

        rev=${{ github.run_number }}

        echo "version=${base}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"

        echo "tag=v${base}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"

        '
    - name: Package with checkinstall
      run: "apt-get install -y checkinstall\ncd vnc_unixsrc\nmkdir -p /usr/share/man/man1\ncheckinstall --default \\\n  --pkgname=tightvnc\
        \ \\\n  --pkgversion=\"${{ steps.version.outputs.version }}\" \\\n  --maintainer=\"graham@netlinux.co.uk\" \\\n  --pakdir=.\
        \ \\\n  --install=no \\\n  --fstrans=no \\\n  ./vncinstall /usr/bin /usr/share/man\n"
    - name: Repack .deb for reprepro compatibility
      run: "cd vnc_unixsrc\nDEB=$(ls tightvnc_*.deb)\nchmod 666 \"$DEB\"\nmkdir repack && cd repack\nar x \"../$DEB\"\nfor\
        \ f in *.zst; do\n  [ -f \"$f\" ] || continue\n  zstd -d \"$f\"\n  xz \"${f%.zst}\"\n  rm \"$f\"\ndone\nrm \"../$DEB\"\
        \nar rcs \"../$DEB\" debian-binary control.tar.xz data.tar.xz\n"
    - uses: actions/upload-artifact@v4
      with:
        name: deb-${{ matrix.target }}
        path: '**/*.deb

          '
        if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Compute tag
      id: tag
      run: echo "tag=v${{ github.run_number }}-dualsuite" >> "$GITHUB_OUTPUT"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Build ${{ github.run_number }} (bookworm + resolute)
        body: 'Dual-suite build from commit ${{ github.sha }}.

          Both ~bookworm1 and ~resolute1 .debs are attached.

          '
        files: artifacts/**/*.deb
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Notify package repository
      run: "sleep 5\nPAYLOAD='{\"repo\":\"netlinux-ai/tightvnc\",\"tag\":\"${{ steps.tag.outputs.tag }}\"}'\nSIGNATURE=$(echo\
        \ -n \"$PAYLOAD\" \\\n  | openssl dgst -sha256 -hmac \"${{ secrets.WEBHOOK_SECRET }}\" -binary \\\n  | xxd -p -c 256)\n\
        curl -sf -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -H \"X-Webhook-Signature: sha256=${SIGNATURE}\"\
        \ \\\n  -d \"$PAYLOAD\" \\\n  https://packages.netlinux.co.uk/webhook/update-repo\n"
'on':
  workflow_dispatch: null
